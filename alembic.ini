# =============================================================================
# lukato 1.0.0 — Alembic
# A URL do banco NAO fica aqui: migrations/env.py le de lukato.config.Settings
# (variavel LUKATO_DB__URL). Assim nao ha credencial versionada.
# =============================================================================
[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
version_path_separator = os
timezone = UTC

# sqlalchemy.url e resolvido em runtime por env.py

[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = console_scripts
ruff_fix.entrypoint = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
