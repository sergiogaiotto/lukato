# Requer o Prometheus Operator. Remova do kustomization se nao usar.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: lukato
  labels:
    app.kubernetes.io/name: lukato
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: lukato
      app.kubernetes.io/component: api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
