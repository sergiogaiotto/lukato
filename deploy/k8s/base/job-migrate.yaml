apiVersion: batch/v1
kind: Job
metadata:
  name: lukato-migrate
  labels:
    app.kubernetes.io/name: lukato
    app.kubernetes.io/component: migration
  annotations:
    # ArgoCD: roda antes de sincronizar a aplicacao
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lukato
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: lukato
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: lukato:1.0.0
          args: ["migrate"]
          envFrom:
            - configMapRef: { name: lukato-config }
            - secretRef:    { name: lukato-secrets }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 128Mi }
