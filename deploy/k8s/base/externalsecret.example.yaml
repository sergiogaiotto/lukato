# =============================================================================
# EXEMPLO — External Secrets Operator (ESO) materializando o Secret
# `lukato-secrets` a partir do OCI Vault.
#
# ESTE ARQUIVO NAO ESTA NO kustomization.yaml, DE PROPOSITO. E um molde: copie
# para o overlay do ambiente, preencha os OCIDs, e so entao adicione a
# `resources:`. Nenhum valor de segredo aparece aqui — apenas PONTEIROS para o
# cofre.
#
# O que o lukato exige (as 6 chaves, ver SECURITY.md e deploy/k8s/base/secret.example.yaml):
#   LUKATO_DB__URL                              URL do PostgreSQL (com usuario e senha)
#   LUKATO_LLM__API_KEY                         virtual key do hub GPU
#   LUKATO_EMBEDDING__API_KEY                   chave do endpoint de embeddings
#   LUKATO_SECURITY__JWT_SECRET                 >= 32 caracteres (openssl rand -hex 32)
#   LUKATO_OBSERVABILITY__LANGFUSE_PUBLIC_KEY   pk-lf-...
#   LUKATO_OBSERVABILITY__LANGFUSE_SECRET_KEY   sk-lf-...
#
# O Deployment consome tudo por `envFrom.secretRef: lukato-secrets`, entao os
# nomes das chaves do Secret precisam ser EXATAMENTE estes.
#
# -----------------------------------------------------------------------------
# A CONFIRMAR COM O TIME DE PLATAFORMA antes de aplicar:
#
#  1. O ESO esta instalado no cluster? NAO confirmei que exista como cluster
#     add-on gerenciado do OKE (a lista de add-ons que consegui verificar cita
#     CoreDNS, Dashboard, Cluster Autoscaler, cert-manager, Istio e o OCI Native
#     Ingress Controller — nao o ESO). Assuma instalacao via Helm ate prova em
#     contrario.
#  2. Qual a VERSAO do ESO / do provider `oracle`? O `apiVersion` abaixo
#     (external-secrets.io/v1) e o do upstream atual; instalacoes mais antigas
#     usam `external-secrets.io/v1beta1`. `kubectl get crd externalsecrets.external-secrets.io
#     -o jsonpath='{.spec.versions[*].name}'` responde.
#  3. `principalType: Workload` (OKE workload identity) exige ENHANCED cluster.
#     Em basic cluster nao funciona — cai para InstancePrincipal ou UserPrincipal.
#  4. Ha alternativa oficial: o OCI Secrets Store CSI Driver Provider, que monta
#     os segredos como ARQUIVOS em volume. A Oracle documenta os dois e nao
#     declara preferencia. Como o lukato le configuracao por VARIAVEL DE AMBIENTE,
#     o ESO encaixa melhor; se a politica interna exigir que o segredo nao exista
#     como objeto Secret no etcd, o caminho e o CSI driver.
# =============================================================================

---
# -----------------------------------------------------------------------------
# 1) SecretStore — como o ESO fala com o OCI Vault.
#
# Este exemplo usa workload identity: sem chave estatica no cluster, a
# ServiceAccount do pod e a credencial. ATENCAO ao valor: e `Workload`, nao
# `WorkloadIdentity`.
# -----------------------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: lukato-oci-vault
  namespace: lukato
  labels:
    app.kubernetes.io/name: lukato
spec:
  provider:
    oracle:
      # OCID do cofre que guarda os segredos do lukato.
      vault: "<PREENCHER: ocid1.vault.oc1.sa-saopaulo-1....>"
      # Regiao do cofre (ex.: sa-saopaulo-1 ou sa-vinhedo-1).
      region: "<PREENCHER: region identifier>"
      # OCID do compartment do cofre. Obrigatorio para PushSecret e para buscar
      # multiplos segredos; inofensivo declarar sempre.
      compartment: "<PREENCHER: ocid1.compartment.oc1....>"
      principalType: Workload
      serviceAccountRef:
        # ServiceAccount usada para autenticar. Precisa existir NESTE namespace
        # e estar contemplada na policy IAM (exemplo no fim do arquivo).
        name: "<PREENCHER: nome da ServiceAccount, ex. lukato-eso>"

---
# -----------------------------------------------------------------------------
# 2) ExternalSecret — cria e mantem o Secret `lukato-secrets`.
#
# `creationPolicy: Owner` faz o ESO ser dono do Secret: apagar este
# ExternalSecret apaga o Secret junto. E o comportamento desejado (o Secret nao
# deve sobreviver a remocao da sua origem).
#
# `refreshInterval: 1h` re-le o cofre de hora em hora. Rotacionar um segredo NAO
# reinicia os pods sozinho — o `envFrom` so e lido no boot. Depois da rotacao:
#   kubectl -n lukato rollout restart deploy/lukato
# (ou instale o reloader que a plataforma padronizar).
# -----------------------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lukato-secrets
  namespace: lukato
  labels:
    app.kubernetes.io/name: lukato
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: lukato-oci-vault
  target:
    name: lukato-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    # `remoteRef.key` = NOME do segredo dentro do cofre (nao o OCID).
    # Um segredo do cofre por chave: e o arranjo mais simples de auditar e de
    # rotacionar isoladamente.

    # URL completa do PostgreSQL, no formato aceito pelo SQLAlchemy/asyncpg:
    #   postgresql+asyncpg://USUARIO:SENHA@<fqdn-privado>:5432/lukato
    # NAO acrescente ?sslmode=... na URL: o asyncpg nao aceita `sslmode` como
    # kwarg e o boot morre com
    #   TypeError: connect() got an unexpected keyword argument 'sslmode'
    # (ver docs/DEPLOY.md, secao de banco).
    - secretKey: LUKATO_DB__URL
      remoteRef:
        key: "<PREENCHER: nome do segredo no cofre, ex. lukato-prod-db-url>"

    # Virtual key do hub GPU (LLM). Restrita aos modelos liberados; em caso de
    # vazamento, revogacao imediata pelo CCOE Arquitetura — GPU Hub.
    - secretKey: LUKATO_LLM__API_KEY
      remoteRef:
        key: "<PREENCHER: ex. lukato-prod-llm-api-key>"

    # Chave do endpoint de embeddings (se o hub de embeddings exigir).
    - secretKey: LUKATO_EMBEDDING__API_KEY
      remoteRef:
        key: "<PREENCHER: ex. lukato-prod-embedding-api-key>"

    # >= 32 caracteres. Gere com: openssl rand -hex 32
    # Com env=prod e auth ligada, o boot RECUSA segredo curto ou conhecido.
    - secretKey: LUKATO_SECURITY__JWT_SECRET
      remoteRef:
        key: "<PREENCHER: ex. lukato-prod-jwt-secret>"

    - secretKey: LUKATO_OBSERVABILITY__LANGFUSE_PUBLIC_KEY
      remoteRef:
        key: "<PREENCHER: ex. lukato-prod-langfuse-public-key>"

    - secretKey: LUKATO_OBSERVABILITY__LANGFUSE_SECRET_KEY
      remoteRef:
        key: "<PREENCHER: ex. lukato-prod-langfuse-secret-key>"

# =============================================================================
# VARIANTE A — um unico segredo JSON no cofre, em vez de seis
#
# Se a plataforma preferir guardar um JSON com as seis chaves, troque o bloco
# `data:` acima por:
#
#   data:
#     - secretKey: LUKATO_DB__URL
#       remoteRef: { key: lukato-prod, property: db_url }
#     - secretKey: LUKATO_LLM__API_KEY
#       remoteRef: { key: lukato-prod, property: llm_api_key }
#     ... (idem para as outras quatro)
#
# Ou, para trazer o JSON inteiro de uma vez (as chaves do JSON viram as chaves do
# Secret e precisam ter EXATAMENTE os nomes LUKATO_*):
#
#   dataFrom:
#     - extract:
#         key: lukato-prod
#
# =============================================================================
# VARIANTE B — UserPrincipal (basic cluster, sem workload identity)
#
# Exige uma chave de API estatica no cluster, guardada em outro Secret. E pior:
# vira um segredo para proteger o cofre de segredos. Use so se workload identity
# nao estiver disponivel.
#
#   spec:
#     provider:
#       oracle:
#         vault: <OCID do cofre>
#         region: <region identifier>
#         principalType: UserPrincipal
#         auth:
#           user: <OCID do usuario>
#           tenancy: <OCID da tenancy>
#           secretRef:
#             privatekey:            # ATENCAO: `privatekey`, k minusculo
#               name: oracle-secret
#               key: privateKey
#             fingerprint:
#               name: oracle-secret
#               key: fingerprint
#
# =============================================================================
# POLICY IAM (workload identity) — quem cria e o time de plataforma
#
#   Allow any-user to read secret-bundles in compartment <compartment> where all {
#     request.principal.type = 'workload',
#     request.principal.namespace = 'lukato',
#     request.principal.service_account = '<nome da ServiceAccount>',
#     request.principal.cluster_id = '<OCID do cluster>'
#   }
#
# Confira o statement com o time antes de abrir chamado: ele veio de extrato de
# busca da doc da Oracle, nao da pagina renderizada.
# =============================================================================
