# =============================================================================
# EXEMPLO — NAO APLIQUE ESTE ARQUIVO COMO ESTA E NAO COMMITE VALORES REAIS.
#
# Em producao use ExternalSecrets / Vault / AWS Secrets Manager:
#
#   apiVersion: external-secrets.io/v1beta1
#   kind: ExternalSecret
#   metadata: { name: lukato-secrets }
#   spec:
#     secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
#     target: { name: lukato-secrets }
#     data:
#       - secretKey: LUKATO_LLM__API_KEY
#         remoteRef: { key: lukato/prod, property: llm_api_key }
#
# A chave do hub GPU e confidencial: guarde em cofre corporativo e solicite
# revogacao imediata ao time de plataforma em caso de vazamento.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: lukato-secrets
  labels:
    app.kubernetes.io/name: lukato
type: Opaque
stringData:
  LUKATO_DB__URL: "postgresql+asyncpg://USUARIO:SENHA@postgres:5432/lukato"
  LUKATO_LLM__API_KEY: "PREENCHER-VIA-COFRE"
  LUKATO_EMBEDDING__API_KEY: "PREENCHER-VIA-COFRE"
  LUKATO_SECURITY__JWT_SECRET: "PREENCHER-VIA-COFRE"          # openssl rand -hex 32
  LUKATO_OBSERVABILITY__LANGFUSE_PUBLIC_KEY: "PREENCHER-VIA-COFRE"
  LUKATO_OBSERVABILITY__LANGFUSE_SECRET_KEY: "PREENCHER-VIA-COFRE"
