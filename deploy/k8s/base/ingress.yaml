apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lukato
  labels:
    app.kubernetes.io/name: lukato
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: lukato.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lukato
                port: { name: http }
  tls:
    - hosts: ["lukato.internal"]
      secretName: lukato-tls
