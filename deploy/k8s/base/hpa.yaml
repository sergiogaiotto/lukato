apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lukato
  labels:
    app.kubernetes.io/name: lukato
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lukato
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 80 }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
